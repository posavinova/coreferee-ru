[project]
name = "coreferee-ru"
version = "1.0.0"
description = "A spaCy component for coreference resolution in Russian text, based on Coreferee framework."
readme = {file = "SHORTREADME.md", content-type = "text/markdown"}
requires-python = ">=3.10,<3.14"
license = "LGPL-3.0-only"
license-files = ["LICENSE"]
authors = [
    {name = "Polina Savinova", email = "posavinova@gmail.com"},
]
keywords = [
    "nlp",
    "spacy",
    "spacy-extension",
    "python",
    "machine-learning",
    "coreference",
    "anaphora",
    "coreference-resolution",
    "anaphora-resolution",
    "Russian",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Intended Audience :: Other Audience",
    "Intended Audience :: Education",
    "Intended Audience :: Information Technology",
    "Intended Audience :: Science/Research",
    "Natural Language :: Russian",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Text Processing :: Linguistic",
]
dependencies = [
    "spacy>=3.8.0,<3.9.0",
]

[project.urls]
Homepage = "https://github.com/posavinova/coreferee-ru"

[project.entry-points."spacy_factories"]
coreferee_ru = "coreferee_ru.manager:CorefereeBroker"

[build-system]
requires = [
    "setuptools",
    "wheel"
]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = {find = {}}
include-package-data = true

[tool.setuptools.package-data]
"*" = ["*.dat", "*.cfg"]
