
name: Coreferee-RU Tests

on:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.12"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install "spacy>=3.8,<3.9" pytest
          python -m pip install .
          python -m pip check

      - name: Install Russian spaCy models
        run: |
          python -m spacy download ru_core_news_sm
          python -m spacy download ru_core_news_md
          python -m spacy download ru_core_news_lg

      - name: Install Coreferee-RU resources
        run: |
          python -m coreferee_ru install ru

      - name: Run tests
        continue-on-error: true
        run: |
          python -m pytest tests/ru
